<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Página Web</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* FONDO */
body{
    background: #cfcfcf;
    font-family: cursive;
}

/* ENCABEZADO */
header{
    width:100%;
    background:#555;
    padding:25px 0;
    text-align:center;
}

/* TITULO */
header h1{
    color:#d7c8ff;
    font-size:42px;
    margin-bottom:20px;
}

/* MENU */
nav a{
    text-decoration:none;
    color:#00ffff;
    margin:0 25px;
    font-size:20px;
    font-weight:bold;
}

nav a:hover{
    text-decoration:underline;
}

/* CONTENIDO */
.contenido{
    width:100%;
    height:500px;
    background:#d9d9d9;
    padding:40px 30px;
}

/* TEXTO */
.contenido p{
    color:rgb(219, 18, 176);
    font-size:28px;
    margin-bottom:35px;
}

/* IMAGEN REDONDA */
.foto{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid white;
}

</style>

</head>
<body>

<!-- ENCABEZADO -->
<header>

    <h1>¡Bienvenidos a mi pagina web!</h1>

    <nav>

        <a href="registro.html">Registro</a>
        <a href="#">Sobre mí</a>
        <a href="#">Contacto</a>
    </nav>
                                                                                                                                            
</header>

<!-- CONTENIDO -->
<section class="contenido">

    <p>
        "Hola soy Silvia y estoy realizando una practica aprendiendo desarrollo wed"
    </p>

    <!-- IMAGEN -->
    <img src="https://i.pinimg.com/736x/48/f0/0e/48f00e033cf34ffa129d18d8745f5178.jpg" class="foto">

</section>

<h2>Mis materias favoritas</h2>

<ul style="list-style-type: disc;">
    <li>Artes Plasticas</li>
    <li>Ed. Fisica</li>
    <li>Sociales</li>
</ul>

</body>
</html>
